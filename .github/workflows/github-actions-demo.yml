name: Sistema de Reserva de Citas Medicas

run-name: ${{ github.actor }} ejecutando pipeline

on: [push]

jobs:
  Validar-Proyecto:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Verificar la estructura del sistema de citas medicas"

  Validar-Usuarios:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Revisar los roles de administrador, medico y paciente"

  Validar-Base-Datos:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Revisar pacientes, medicos, especialidades y citas"

  Validar-Reservas:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Verificar reservas, modificaciones y cancelaciones de citas"

  Analizar-Seguridad:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Revisar la proteccion de datos personales de los pacientes"

  Planificar-Despliegue:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Preparar el entorno para desplegar el sistema"

  Entregar-Ambiente:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Publicar el sistema en el ambiente de pruebas"

  Monitorear-Sistema:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Supervisar el funcionamiento y las reservas de citas"